<div id="inici"><div><h1>Ulls en la foscor</h1><p>Demo de l'escena. La càmera gira sola; pots arrossegar per mirar tu. Si mires fix el que t'espia, s'espanta.</p><button id="go">Obrir els ulls</button><p class="p">Amb so: abans que aparegui la figura se senten passes.</p></div></div>
<div id="nota">Demo: la càmera gira sola. Arrossega per mirar tu. Si mires fix els ulls, fugen.</div></div>
<script>
const diferenciaRumb=(a,b)=>{const d=(((a-b)%360)+540)%360-180;return d===-180?180:d};
/**
 * Les passes de l'extra de realitat augmentada: uns peus que s'acosten pel camí abans que
 * aparegui la figura. Sintetitzades amb Web Audio (sense fitxers) i amb una mica d'estèreo, perquè
 * se senti pel costat des d'on vindrà. No hi ha cap altre so. Només comença quan l'usuari toca el
 * botó d'entrada (els navegadors mòbils no deixen sonar abans) i s'atura en sortir.
 */
let context = null;
let soroll = null;
function obtenirContext() {
    if (typeof window === "undefined")
        return null;
    if (!context) {
        const Ctor = window.AudioContext ?? window.webkitAudioContext;
        if (!Ctor)
            return null;
        try {
            context = new Ctor();
        }
        catch {
            return null;
        }
    }
    return context;
}
/** Soroll blanc breu, compartit per totes les passes. */
function bufferSoroll(ctx) {
    if (soroll)
        return soroll;
    const buffer = ctx.createBuffer(1, Math.round(ctx.sampleRate * 0.25), ctx.sampleRate);
    const dades = buffer.getChannelData(0);
    for (let i = 0; i < dades.length; i++)
        dades[i] = Math.random() * 2 - 1;
    soroll = buffer;
    return buffer;
}
/** Prepara el so. S'ha de cridar dins d'un gest de l'usuari. */
function iniciarSoAr() {
    obtenirContext()
        ?.resume()
        .catch(() => { });
}
function aturarSoAr() {
    context?.close().catch(() => { });
    context = null;
    soroll = null;
}
/**
 * Passes de qui s'acosta caminant durant `duradaMs`: cada pas és un copet greu i un cruixit de
 * terra, i van pujant de volum. `pan` va de -1 (esquerra) a 1 (dreta).
 */
function sonarPassesAr(pan, duradaMs) {
    const ctx = obtenirContext();
    if (!ctx || ctx.state !== "running")
        return;
    const pas = 0.62;
    const passos = Math.max(2, Math.floor(duradaMs / 1000 / pas));
    const inici = ctx.currentTime + 0.1;
    for (let i = 0; i < passos; i++) {
        const t = inici + i * pas + (Math.random() - 0.5) * 0.06;
        const volum = 0.1 + 0.5 * (i / (passos - 1));
        const sortida = ctx.createGain();
        sortida.gain.value = 1;
        if (typeof ctx.createStereoPanner === "function") {
            const panner = ctx.createStereoPanner();
            // Un peu cada cop una mica més cap al centre: s'acosta.
            panner.pan.value = pan * (1 - 0.5 * (i / (passos - 1)));
            sortida.connect(panner).connect(ctx.destination);
        }
        else {
            sortida.connect(ctx.destination);
        }
        // Cruixit de grava: soroll filtrat i molt curt.
        const font = ctx.createBufferSource();
        font.buffer = bufferSoroll(ctx);
        const filtre = ctx.createBiquadFilter();
        filtre.type = "bandpass";
        filtre.frequency.value = i % 2 === 0 ? 720 : 560;
        filtre.Q.value = 0.9;
        const gc = ctx.createGain();
        gc.gain.setValueAtTime(0.0001, t);
        gc.gain.exponentialRampToValueAtTime(volum, t + 0.008);
        gc.gain.exponentialRampToValueAtTime(0.0001, t + 0.11);
        font.connect(filtre).connect(gc).connect(sortida);
        font.start(t);
        font.stop(t + 0.14);
        // Copet greu del taló.
        const cop = ctx.createOscillator();
        cop.type = "sine";
        cop.frequency.setValueAtTime(95, t);
        cop.frequency.exponentialRampToValueAtTime(52, t + 0.12);
        const gp = ctx.createGain();
        gp.gain.setValueAtTime(0.0001, t);
        gp.gain.exponentialRampToValueAtTime(volum * 0.9, t + 0.006);
        gp.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
        cop.connect(gp).connect(sortida);
        cop.start(t);
        cop.stop(t + 0.18);
    }
}

/**
 * Escena "ulls en la foscor": parells d'ulls que brillen entre les ombres i siluetes que espien
 * de lluny. Es dibuixa en un canvas transparent sobre el vídeo de la càmera. Els personatges
 * viuen en un "cel" fix al voltant de l'usuari (no dels metres GPS), així que la tremolor del GPS
 * no els belluga.
 *
 * Fan el que fa algú que et vigila:
 * - abans que aparegui la figura se senten passes que s'acosten, i mentre és present no hi ha cap
 *   parell d'ulls a la foscor;
 * - apareixen a la vora del camp de visió o darrere teu, mai just al davant; els ulls sempre
 *   molt lluny, com una cosa que et mira des del fons del bosc;
 * - si els mires fix se n'adonen: els ulls desapareixen de cop, la
 *   figura es dissol;
 * - els ulls són una mica diferents: alts, baixos, amb pupil·la de bèstia. La figura és només la
 *   imatge, sense cap altre element al voltant.
 */
/** Temps que se senten les passes abans que aparegui la figura (ms). */
const DURADA_PASSES_MS = 4800;
const BASE = {
    tipus: "ulls",
    color: "255, 45, 35",
    distMin: 26,
    distMax: 38,
    altMin: 0.8,
    altMax: 2.2,
    escala: 1,
    pupilaVertical: false,
    alcada: 1.9,
    ample: 0.42,
};
const VARIETATS = {
    /** Els ulls de sempre: vermells, a alçada de persona. */
    normal: { ...BASE, escala: 2.2 },
    /** Petits, junts i a ran de terra, vermell encès: com una rata gran o una cosa que s'arrossega. */
    baix: { ...BASE, color: "255, 90, 30", distMin: 24, distMax: 34, altMin: 0.15, altMax: 0.45, escala: 2 },
    /** Enormes i molt amunt, entre les branques: alguna cosa gran que no és d'aquí. */
    alt: { ...BASE, color: "255, 70, 25", distMin: 34, distMax: 46, altMin: 2.6, altMax: 3.9, escala: 3 },
    /** Vermell fosc, amb pupil·la vertical de bèstia. */
    bestia: { ...BASE, color: "235, 20, 45", distMin: 24, distMax: 34, altMin: 0.9, altMax: 1.5, escala: 2.4, pupilaVertical: true },
    monjo: { ...BASE, tipus: "silueta", distMin: 13, distMax: 20 },
};
/** Imatge de la figura (public/images/ar/figura-encaputxada.webp, retallada a la figura) i la seva proporció. */
const IMATGE_FIGURA = "/images/ar/figura-encaputxada.webp";
const FIGURA = { ample: 306 / 699 };
const ALCADA_CAMERA = 1.5;
const FOV_HORITZONTAL = 52;
const RAD = Math.PI / 180;
const aleatori = (min, max) => min + Math.random() * (max - min);
const mitja = (x) => x * x * (3 - 2 * x);
function nou(v, espera, ara) {
    return {
        v,
        fase: "amagat",
        motiu: "temps",
        rumb: 0,
        dist: v.distMin,
        alt: v.altMin,
        desde: ara,
        fins: ara + espera,
        mirat: 0,
        proximaParpella: 0,
        parpellaEsq: 0,
        parpellaDre: 0,
        llavor: Math.random() * 1000,
        asim: aleatori(0.86, 1.14),
        costat: Math.random() < 0.5 ? -1 : 1,
    };
}
function durada(p, fase) {
    if (fase === "apareix")
        return p.v.tipus === "ulls" ? 900 : 2800;
    if (p.v.tipus === "ulls")
        return 300;
    return 700;
}
function aparicio(p, mirada, ara) {
    // A la vora o darrere del camp de visió: es noten en girar.
    const costat = Math.random() < 0.5 ? -1 : 1;
    p.rumb = (mirada.rumb + costat * aleatori(30, 130) + 720) % 360;
    p.dist = aleatori(p.v.distMin, p.v.distMax);
    p.alt = p.v.tipus === "ulls" ? aleatori(p.v.altMin, p.v.altMax) : 0;
    p.costat = Math.random() < 0.5 ? -1 : 1;
    p.fase = "apareix";
    p.motiu = "temps";
    p.desde = ara;
    p.mirat = 0;
    p.proximaParpella = ara + aleatori(1200, 3500);
    p.parpellaEsq = 0;
    p.parpellaDre = 0;
}
function actualitza(p, mirada, ara, dt, figuraActiva, alPasses) {
    // Mentre hi ha la figura (o se'n senten les passes) no hi ha ulls a la foscor.
    if (p.v.tipus === "ulls" && figuraActiva && (p.fase === "apareix" || p.fase === "present")) {
        p.fase = "fuig";
        p.motiu = "temps";
        p.desde = ara;
        return;
    }
    switch (p.fase) {
        case "amagat":
            if (ara >= p.fins) {
                if (p.v.tipus === "ulls" && figuraActiva) {
                    p.fins = ara + 1500;
                    return;
                }
                aparicio(p, mirada, ara);
                if (p.v.tipus === "silueta") {
                    p.fase = "passes";
                    alPasses?.(Math.max(-1, Math.min(1, diferenciaRumb(p.rumb, mirada.rumb) / 70)), DURADA_PASSES_MS);
                }
            }
            return;
        case "passes":
            // Només es senten uns peus que s'acosten; la figura encara no es veu.
            if (ara - p.desde >= DURADA_PASSES_MS) {
                p.fase = "apareix";
                p.desde = ara;
            }
            return;
        case "apareix":
            if (ara - p.desde >= durada(p, "apareix")) {
                p.fase = "present";
                p.desde = ara;
                p.fins = ara + aleatori(14000, 26000);
            }
            break;
        case "present":
            if (p.v.tipus === "ulls" && ara >= p.proximaParpella) {
                const sort = Math.random();
                if (sort < 0.7) {
                    p.parpellaEsq = p.parpellaDre = ara + 170;
                    p.proximaParpella = ara + aleatori(1800, 5000);
                }
                else if (sort < 0.85) {
                    // Doble parpelleig, ràpid, com algú nerviós.
                    p.parpellaEsq = p.parpellaDre = ara + 130;
                    p.proximaParpella = ara + 330;
                }
                else {
                    // Només un ull: una clucada que no és de persona.
                    if (Math.random() < 0.5)
                        p.parpellaEsq = ara + 260;
                    else
                        p.parpellaDre = ara + 260;
                    p.proximaParpella = ara + aleatori(2500, 5500);
                }
            }
            if (ara >= p.fins) {
                p.fase = "fuig";
                p.motiu = "temps";
                p.desde = ara;
            }
            break;
        case "fuig":
            if (ara - p.desde >= durada(p, "fuig")) {
                p.fase = "amagat";
                p.fins = ara + (p.v.tipus === "silueta" ? aleatori(15000, 30000) : aleatori(5000, 12000));
            }
            return;
    }
    if (p.fase !== "present")
        return;
    const dx = diferenciaRumb(p.rumb, mirada.rumb);
    const alturaCap = p.v.tipus === "silueta" ? p.v.alcada * 0.86 : p.alt;
    const elevacio = Math.atan((alturaCap - ALCADA_CAMERA) / p.dist) / RAD;
    const dy = Math.abs(elevacio - mirada.elevacio);
    // Si el mires fix, se n'adona i fuig.
    if (Math.abs(dx) < 9 && dy < 16) {
        p.mirat += dt;
        const llindar = p.v.tipus === "ulls" ? 800 : 1300;
        if (p.mirat > llindar) {
            p.fase = "fuig";
            p.motiu = "mirat";
            p.desde = ara;
            p.mirat = 0;
            try {
                navigator.vibrate?.(35);
            }
            catch {
                // Sense vibració: no passa res.
            }
        }
    }
    else {
        p.mirat = Math.max(0, p.mirat - dt * 0.5);
    }
}
/** Opacitat segons la fase. Els ulls espantats s'encenen un instant i desapareixen de cop. */
function opacitat(p, ara) {
    const t = ara - p.desde;
    if (p.fase === "apareix")
        return mitja(Math.min(1, t / durada(p, "apareix")));
    if (p.fase === "present")
        return 1;
    if (p.fase === "fuig") {
        if (p.v.tipus === "ulls") {
            if (p.motiu === "mirat")
                return t < 150 ? 1 : 0;
            return Math.max(0, 1 - t / durada(p, "fuig"));
        }
        const f = t / durada(p, "fuig");
        return Math.max(0, 1 - f);
    }
    return 0;
}
/** Llum que oscil·la i parpelleja una mica: res no brilla amb una intensitat perfecta. */
function llum(p, ara) {
    return 0.8 + 0.12 * Math.sin(ara / 430 + p.llavor) + 0.08 * Math.sin(ara / 97 + p.llavor * 3);
}
function dibuixaUlls(ctx, x, y, unitatBase, alfa, o) {
    const unitat = unitatBase;
    const separacio = unitat * 0.3;
    const costats = [
        [-1, 1, o.tancatEsq],
        [1, o.asim, o.tancatDre],
    ];
    for (const [costat, mida, tancat] of costats) {
        const cx = x + costat * separacio;
        const meitatAmple = unitat * 0.15 * mida;
        const meitatAlt = Math.max(0.5, unitat * 0.055 * mida * (1 - tancat));
        // Llum que se suma a la del voltant, no que la tapa.
        ctx.save();
        ctx.globalCompositeOperation = "lighter";
        const halo = ctx.createRadialGradient(cx, y, 0, cx, y, unitat * 0.55 * mida);
        halo.addColorStop(0, `rgba(${o.color}, ${0.45 * alfa})`);
        halo.addColorStop(1, `rgba(${o.color}, 0)`);
        ctx.fillStyle = halo;
        ctx.fillRect(cx - unitat * 0.6, y - unitat * 0.6, unitat * 1.2, unitat * 1.2);
        ctx.restore();
        // Ull amb forma d'ametlla, inclinat amb la cantonada de dins cap avall (mirall horitzontal de la versió anterior).
        ctx.save();
        ctx.translate(cx, y);
        ctx.rotate(-costat * 0.22);
        ctx.beginPath();
        ctx.moveTo(-meitatAmple, 0);
        ctx.quadraticCurveTo(0, -meitatAlt * 2, meitatAmple, 0);
        ctx.quadraticCurveTo(0, meitatAlt * 2, -meitatAmple, 0);
        ctx.fillStyle = `rgba(${o.color}, ${alfa})`;
        ctx.shadowColor = `rgba(${o.color}, ${alfa})`;
        ctx.shadowBlur = unitat * 0.25;
        ctx.fill();
        ctx.shadowBlur = 0;
        // Nucli molt clar al mig.
        ctx.beginPath();
        ctx.ellipse(0, 0, meitatAmple * 0.55, Math.max(0.3, meitatAlt * 0.5), 0, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 215, 195, ${alfa * 0.85})`;
        ctx.fill();
        // Pupil·la vertical de bèstia, que segueix el jugador.
        if (o.pupilaVertical && meitatAlt > 2) {
            ctx.beginPath();
            ctx.ellipse(o.segueix * meitatAmple * 0.4, 0, meitatAmple * 0.13, meitatAlt * 0.95, 0, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(0, 0, 0, ${alfa * 0.92})`;
            ctx.fill();
        }
        ctx.restore();
    }
}
/** La figura de la imatge, sense res més al voltant. */
function dibuixaSilueta(ctx, x, yPeus, alcada, alfa, ara, p, imatge) {
    if (imatge === null || !imatge.complete || imatge.naturalWidth === 0)
        return;
    const ample = alcada * FIGURA.ample;
    const balanceig = Math.sin(ara / 1700 + p.llavor) * alcada * 0.012;
    ctx.globalAlpha = alfa;
    ctx.drawImage(imatge, x + balanceig - ample / 2, yPeus - alcada, ample, alcada);
    ctx.globalAlpha = 1;
}

const canvas=document.getElementById("ar"), fons=document.getElementById("fons");
const ctx=canvas.getContext("2d"), cf=fons.getContext("2d");
let w=0,h=0;
function mida(){const dpr=Math.min(devicePixelRatio||1,2);w=canvas.clientWidth;h=canvas.clientHeight;for(const c of [canvas,fons]){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr);c.getContext("2d").setTransform(dpr,0,0,dpr,0,0)}}
mida();addEventListener("resize",mida);
// Arbres i turons fixos per rumb, perquè el fons es mogui amb la mirada.
const arbres=Array.from({length:70},()=>({r:Math.random()*360,al:2+Math.random()*9,am:1+Math.random()*2.5}));
function pintaFons(m){
  const fx=w/2/Math.tan(FOV_HORITZONTAL/2*RAD);
  const horitzo=h/2-fx*Math.tan((0-m.elevacio)*RAD)+h*0.06;
  const g=cf.createLinearGradient(0,0,0,h);g.addColorStop(0,"#0a1428");g.addColorStop(Math.min(.95,Math.max(.1,horitzo/h)),"#16243a");g.addColorStop(1,"#05080f");
  cf.fillStyle=g;cf.fillRect(0,0,w,h);
  // lluna
  const dl=diferenciaRumb(40,m.rumb);if(Math.abs(dl)<60){const x=w/2+fx*Math.tan(dl*RAD),y=horitzo-fx*Math.tan(22*RAD);const lg=cf.createRadialGradient(x,y,0,x,y,70);lg.addColorStop(0,"rgba(220,235,255,.9)");lg.addColorStop(.25,"rgba(190,210,240,.25)");lg.addColorStop(1,"rgba(190,210,240,0)");cf.fillStyle=lg;cf.fillRect(x-80,y-80,160,160)}
  cf.fillStyle="#04070c";cf.fillRect(0,horitzo,w,h-horitzo);
  for(const a of arbres){const d=diferenciaRumb(a.r,m.rumb);if(Math.abs(d)>45)continue;const x=w/2+fx*Math.tan(d*RAD);const ah=a.al*fx/30,am=a.am*fx/30;cf.fillStyle="#04070c";cf.beginPath();cf.moveTo(x-am,horitzo+4);cf.lineTo(x,horitzo-ah);cf.lineTo(x+am,horitzo+4);cf.closePath();cf.fill()}
}
let engegat=false;
document.getElementById("go").addEventListener("click",()=>{iniciarSoAr();engegat=true;document.getElementById("inici").style.display="none"});
