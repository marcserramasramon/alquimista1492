<svg viewBox="0 0 192 192" xmlns="http://www.w3.org/2000/svg">
  <rect width="192" height="192" fill="#fbf4e4" rx="45"/>
  <g transform="translate(96, 96)">
    <!-- Anell exterior -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#1b1511" stroke-width="2"/>

    <!-- Puntes del pentagrama -->
    <g>
      <!-- Punta superior -->
      <circle cx="0" cy="-50" r="14" fill="#fffdf7" stroke="#4f46e5" stroke-width="3"/>
      <!-- Punta superior dreta -->
      <circle cx="47.5" cy="-15.5" r="14" fill="#fffdf7" stroke="#06b6d4" stroke-width="3"/>
      <!-- Punta inferior dreta -->
      <circle cx="29.4" cy="40.5" r="14" fill="#fffdf7" stroke="#ec4899" stroke-width="3"/>
      <!-- Punta inferior esquerra -->
      <circle cx="-29.4" cy="40.5" r="14" fill="#fffdf7" stroke="#f97316" stroke-width="3"/>
      <!-- Punta superior esquerra -->
      <circle cx="-47.5" cy="-15.5" r="14" fill="#fffdf7" stroke="#7c3aed" stroke-width="3"/>
    </g>

    <!-- Estrella (línies entre puntes) -->
    <g stroke="#1b1511" stroke-width="1.5" stroke-opacity="0.5" stroke-dasharray="2 2">
      <line x1="0" y1="-50" x2="47.5" y2="-15.5"/>
      <line x1="47.5" y1="-15.5" x2="29.4" y2="40.5"/>
      <line x1="29.4" y1="40.5" x2="-29.4" y2="40.5"/>
      <line x1="-29.4" y1="40.5" x2="-47.5" y2="-15.5"/>
      <line x1="-47.5" y1="-15.5" x2="0" y2="-50"/>
    </g>

    <!-- Gresol central -->
    <circle cx="0" cy="0" r="18" fill="#e9d5a6" stroke="#1b1511" stroke-width="1.5" opacity="0.4"/>
  </g>
</svg>